    <h1 class="Titre">Nos Destinations</h1>
    <section class="Europe" id="Europe">
        <h2>Nos escapades en Europe</h2>
        <figure>
            <img src="Images/SwitzerlandGlobal.jpg" alt="Paysage alpin suisse avec des chalets traditionnels en 
            bois au bord d'un lac cristallin et des montagnes enneigées en arrière-plan">
            <figcaption>
                <h3>Suisse</h3>
                <p>Défiez les glaciers éternels et plongez dans des lacs miroirs. Un programme entre 
                    randonnées spectaculaires dans les Alpes et détente dans des chalets traditionnels.</p>
                    <a href="Suisse.html" class="Boutonplus" >En savoir plus</a>
            </figcaption>
            </figure>
            <figure>
                <img src="Images/Italy.jpg" alt="Village de Positano illuminé au crépuscule, Italie.">
                <figcaption>
                    <h3>Italie</h3>
                    <p>Laissez-vous envoûter par l'élégance de Venise, les vestiges de Rome et la douceur de la Toscane.
                        Notre itinéraire exclusif vous offre le meilleur de la culture et de la gastronomie italienne.</p>
                        <a href="Italy.html" class="Boutonplus">En savoir plus</a>
                </figcaption>
            </figure>
            <figure>
            <img src="Images/Greece.jpg" alt="Maisons blanches et vue sur mer à Santorin, Grèce.">
            <figcaption>
                <h3>Grèce</h3>
                <p>Découvrez l'harmonie des Cyclades, ses églises aux dômes bleus et ses couchers de soleil légendaires.
                     L'escapade parfaite entre plages paradisiaques et histoire millénaire.</p>
                     <a href="Greece.html" class="Boutonplus">En savoir plus</a>
            </figcaption>
            </figure>
    </section>
    <section class="National" id="National">
        <h2>Nos trésors du Maroc</h2>
        <figure>
            <img src="Images/MarrakechGlobal.jpg" alt="Vue panoramique de la place Jemaa el-Fna à Marrakech
             au coucher du soleil, avec la Koutoubia au fond">
            <figcaption>
                <h3>Marrakech</h3>
                <p>Passez de l'énergie des souks à la conquête du Toubkal. Notre itinéraire vous guide 
                    de la médina animée aux randonnées inoubliables au pied de l'Atlas.</p>
                    <a href="Marrakech.html" class="Boutonplus">En savoir plus</a>
            </figcaption>
        </figure>
        <figure>
            <img src="Images/Chefchaouen.jpg" alt="Ruelle bleue décorée à Chefchaouen, Maroc.">
            <figcaption>
                <h3>Chefchaouen</h3>
                <p> Une immersion poétique dans les ruelles azur du Rif. Découvrez l'artisanat local et profitez 
                    d'une vue imprenable depuis les hauteurs de la ville bleue.</p>
                    <a href="Chefchaouen.html" class="Boutonplus">En savoir plus</a>
            </figcaption>
        </figure>
        <figure>
            <img src="Images/Merzouga.jpg" alt="Caravane de dromadaires dans les dunes de Merzouga.">
            <figcaption>
                <h3>Merzouga</h3>
                <p>Vivez l'aventure absolue au cœur des dunes dorées. Parcourez l'Erg Chebbi à dos de chameau 
                    et passez des nuits magiques sous le ciel étoilé du Sahara.</p>
                    <a href="Merzouga.html" class="Boutonplus">En savoir plus</a>
            </figcaption>
        </figure>
    </section>
    <section class="Autres" id="Autres">
        <h2>Nos aventures lointaines</h2>
        <figure>
            <img src="Images/USANY.jpg" alt="Statue de la Liberté et skyline de New York.">
            <figcaption>
                <h3>USA</h3>
                <p>Explorez la grandeur de New York, le glamour de Los Angeles et les paysages monumentaux des
                     parcs nationaux. Un parcours sur mesure pour vivre le rêve américain.</p>
                     <a href="USA.html" class="Boutonplus" >En savoir plus</a>
            </figcaption>
        </figure>
        <figure>
            <img src="Images/SeoulGlobal.jpg" alt="Temple coréen traditionnel illuminé de nuit, 
            entouré de cerisiers en fleurs (Sakura) se reflétant dans l'eau d'un bassin calme">
            <figcaption>
                <h3>Corée du Sud</h3>
                <p>Un voyage fascinant entre palais ancestraux et futurisme néon. Explorez le dynamisme de Séoul, 
                    les temples zen millénaires et savourez une culture gastronomique unique au monde.</p>
                    <a href="Seoul.html" class="Boutonplus">En savoir plus</a>
            </figcaption>
        </figure>
        <figure>
            <img src="Images/Bali.jpg" alt="Falaise de Kelingking Beach à Nusa Penida, Bali.">
            <figcaption>
                <h3>Bali</h3>
                <p>L'équilibre parfait entre aventure et sérénité. Randonnez dans les rizières d'Ubud et 
                    ressourcez-vous sur les plages paradisiaques bordées de palmiers.</p>
                    <a href="Bali.html" class="Boutonplus">En savoir plus</a>
            </figcaption>
        </figure>
    </section>
